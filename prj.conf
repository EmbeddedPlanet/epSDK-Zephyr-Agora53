CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_I2C=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y
CONFIG_FP_HARDABI=y
CONFIG_MULTITHREADING=y
CONFIG_SPI=y

#Enable FOTA BLE service in the application
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="AGORA53"

# Enable uart driver
CONFIG_SERIAL=y

# Enable ADC
CONFIG_ADC=y

# enable console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_TICKLESS_KERNEL=y

# Choose either Asynchronous (DMA-driven, highly efficient) or Interrupt-driven UART
CONFIG_UART_INTERRUPT_DRIVEN=y

# Enable Zephyr's AT command parsing pipeline
CONFIG_MODEM_MODULES=y
CONFIG_MODEM_PIPE=y
CONFIG_MODEM_CHAT=y
CONFIG_MODEM_BACKEND_UART=y
CONFIG_MODEM_LOG_LEVEL_DBG=y
CONFIG_MODEM_MODULES_LOG_LEVEL_DBG=y

# Enable the Zephyr generic regulator driver framework
CONFIG_REGULATOR=y

# Use power management
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Enable the External Crystal (LFXO) selection
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=n
